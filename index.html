
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbify App</title>
    
    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // We now need useRef to connect our custom buttons to the hidden file inputs
        const { useState, useRef } = React;

        const HerbifyApp = () => {
            const [selectedFile, setSelectedFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            // Create references for our hidden inputs
            const cameraInputRef = useRef(null);
            const fileInputRef = useRef(null);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setSelectedFile(file);
                    setPreview(URL.createObjectURL(file));
                    setResult(null);
                    setError(null);
                }
            };

            const handlePredict = async () => {
                if (!selectedFile) return;

                setLoading(true);
                setResult(null);
                setError(null);

                const formData = new FormData();
                formData.append('file', selectedFile);

                try {
                    const response = await fetch('https://herbify-backend-baaz.onrender.com/predict', {
                        method: 'POST',
                        body: formData,
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setResult(data);
                    } else {
                        setError(data.detail || "Something went wrong processing the image.");
                    }
                } catch (err) {
                    setError("Network error. The server might be sleeping, please try again in 30 seconds.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8 font-sans">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-8 space-y-6">
                        
                        {/* Header */}
                        <div className="text-center">
                            <h1 className="text-3xl font-extrabold text-green-700 tracking-tight">
                                🌿 Herbify AI
                            </h1>
                            <p className="mt-2 text-sm text-gray-500">
                                Snap a photo or upload an image from your gallery to identify the plant.
                            </p>
                        </div>

                        {/* Custom Upload/Camera Buttons */}
                        <div className="space-y-4">
                            
                            {/* The hidden HTML file inputs */}
                            <input 
                                type="file" 
                                accept="image/jpeg, image/png" 
                                capture="environment" 
                                ref={cameraInputRef} 
                                onChange={handleImageChange} 
                                className="hidden" 
                            />
                            <input 
                                type="file" 
                                accept="image/jpeg, image/png" 
                                ref={fileInputRef} 
                                onChange={handleImageChange} 
                                className="hidden" 
                            />

                            {/* The beautiful Tailwind buttons that trigger the hidden inputs */}
                            <div className="flex space-x-3">
                                <button 
                                    onClick={() => cameraInputRef.current.click()}
                                    className="flex-1 flex justify-center items-center py-3 border-2 border-green-200 rounded-xl text-green-700 bg-green-50 hover:bg-green-100 font-semibold transition-colors"
                                >
                                    📸 Take Photo
                                </button>
                                <button 
                                    onClick={() => fileInputRef.current.click()}
                                    className="flex-1 flex justify-center items-center py-3 border-2 border-green-200 rounded-xl text-green-700 bg-green-50 hover:bg-green-100 font-semibold transition-colors"
                                >
                                    📁 Choose File
                                </button>
                            </div>
                        </div>

                        {/* Image Preview */}
                        {preview && (
                            <div className="mt-4 flex justify-center border-2 border-dashed border-gray-200 rounded-xl p-2 bg-gray-50">
                                <img src={preview} alt="Preview" className="max-h-64 object-contain rounded-lg shadow-sm" />
                            </div>
                        )}

                        {/* Submit Button */}
                        <button 
                            onClick={handlePredict}
                            disabled={!selectedFile || loading}
                            className={`w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-lg font-bold text-white ${!selectedFile ? 'bg-gray-300 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 shadow-md'} focus:outline-none transition-all duration-200`}
                        >
                            {loading ? '🔍 Analyzing...' : 'Identify Herb'}
                        </button>

                        {/* Loading Indicator */}
                        {loading && (
                            <div className="text-center text-green-600 font-medium animate-pulse mt-4">
                                ⏳ Scanning leaves and comparing data...
                            </div>
                        )}

                        {/* Results Section */}
                        {result && (
                            <div className="mt-6 bg-green-50 border-2 border-green-200 rounded-xl p-5 text-center shadow-sm">
                                <h3 className="text-xs font-bold text-green-600 uppercase tracking-widest mb-1">AI Prediction</h3>
                                <p className="text-2xl font-black text-green-900">{result.herb}</p>
                                <div className="mt-3 inline-block bg-white rounded-full px-4 py-1 border border-green-100">
                                    <p className="text-sm text-green-700 font-medium">
                                        Confidence: <span className="font-bold">{result.confidence}%</span>
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* Error Section */}
                        {error && (
                            <div className="mt-6 bg-red-50 border border-red-200 rounded-xl p-4 text-center">
                                <p className="text-sm font-medium text-red-700">{error}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HerbifyApp />);
    </script>
</body>
</html>
